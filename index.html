正常鋼筋：金屬原色表面對光纖雷射（波長約 1060–1080 nm）具有較高的初始反射率。雷射照射瞬間會先反射一部分，隨著金屬表面溫度迅速升高、進入溫升期後吸收率才會提升並穿透。

生鏽嚴重： 表面粗糙度改變：銹層（主要成分為氧化鐵，如 Fe₂O₃、Fe₃O₄）使表面變得疏鬆、多孔。這會降低鏡面反射、增加漫反射與多重反射，導致局部雷射能量吸收率瞬間不均勻。 焦點能量偏移：厚重且不均勻的銹層等於改變了實際的「表面高度」，雷射光斑在接觸到真實金屬基底前，能量可能已被銹層消耗或散射，造成穿孔（Piercing）延遲或失敗（俗稱爆孔、悶炮）。

噴漆與標籤貼紙： 有機高分子吸收/反射差異：漆膜和貼紙的顏色與材質決定了雷射初期的吸收率。深色漆會迅速吸收能量碳化，淺色或反光漆則可能造成雷射反射回切割頭。 瞬間氣化障礙：雷射照射到貼紙或厚漆時，有機物不會像金屬一樣順利熔化，而是瞬間劇烈氣化、碳化，產生大量濃煙與碳渣，阻擋或散射後續的雷射光束。`,chemical:`化學與熱力學變化（Chemical & Thermodynamic Changes）：放熱反應失衡與燃燒雜質
正常鋼筋：在輔助氣體（通常切碳鋼用純氧 O₂）的配合下，高溫鐵與氧氣發生純淨的放熱氧化反應（例如 Fe + O₂ → 壓力和熱量），提供主要的輔助切割熱能，形成平整的切縫。

生鏽嚴重： 氧化狀態異常：銹本身已經是「氧化鐵」，它無法再像純鐵那樣提供乾淨且可控的劇烈放熱反應。銹層的存在會打亂原本計算好的「氣體-金屬燃燒平衡」，導致局部熱量過高（引發過燒、熔渣增多）或熱量不足（切不透）。

噴漆與標籤貼紙： 熱解與碳化反應：漆料和貼紙膠水在雷射高熱下會發生熱裂解，釋放大量有機氣體（VOCs）與碳微粒。碳微粒附著在切縫邊緣會形成碳化層，影響後續焊接性；同時燃燒產生的雜質會改變熔渣的黏度，使熔渣變得難以被高壓氧氣吹飛，形成嚴重的底部掛渣（Dross）。`,physical:`物理與流體力學變化（Physical & Fluid Dynamics Changes）：氣場紊亂與飛濺物汙染
正常鋼筋：高壓輔助氣體透過銅嘴形成穩定的層流，順暢地將熔化金屬吹落。
